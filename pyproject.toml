[project]
name = "bucharest-urban-mobility"
version = "0.1.0"
description = "End-to-end data engineering platform for Bucharest public transport, integrating GTFS Static, GTFS-Realtime, and weather data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
]   

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.uv]
package = false
